/* Layout: one 9:16 cinema stage centred on black; UI chips pinned to the stage corners. Single dark look by design. */
:root {

html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-ui); margin: 0; display: grid; place-items: center; overflow: hidden; }
#stage { position: relative; height: min(100%, 177.78vw); aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: #000;

  [[P1, 72, 'g1'], [P2, 28, 'g2']].forEach(([id, x, cls]) => { const g = new Image(); g.src = IMG(id); g.alt = ''; g.style.left = `${x}%`; g.className = cls; ghosts.append(g); });
  const s = el('div', 'start', `
    <div class="press" dir="ltr">INSERT VOTE</div>
    <div class="press-he">הכניסו פתק כדי להתחיל</div>
    <div class="btns">
      <button type="button" id="goSnd" class="arc a1">🔊 עם סאונד</button>
      <button type="button" id="goMute" class="arc a2">🔇 בשקט, יש לי שכנים</button>
    </div>
    <div class="credit">פתקים: 1</div>`);
  cam.append(ghosts, s);
  A(s, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
  const go = (withSound) => { soundOn = withSound; if (withSound) { unlock(); sfx('lock', .9); } flash(.5, 140); shake(6); setTimeout(trailer, 350); };
  s.querySelector('#goSnd').onclick = () => go(true);
  s.querySelector('#goMute').onclick = () => go(false);
}
function end() { skipBtn?.remove(); skipBtn = null; againBtn = uiBtn('again', '↻ שוב', trailer); }
function trailer() {
  reset(); showSnd();
  skipBtn = uiBtn('skip', 'דלגו ⏭', () => { reset(); poster(false); if (soundOn) { SND.idle.volume = .45; SND.idle.play().catch(() => {}); } end(); });
  select();
  at(10900, () => poster(true));
  at(10900 + 3300, end);
}

Promise.all([document.fonts.load('italic 500 40px Saira'), document.fonts.load('40px "Secular One"')]).catch(() => {}).finally(() => {
  if (location.hash === '#poster') { reset(); rollStyles(true); poster(false); } else boot();
});
</script>
