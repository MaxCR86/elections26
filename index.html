<style>
/* Layout: one 9:16 cinema stage centred on black; UI chips pinned to the stage corners. Single dark look by design. */
:root {
  --ink: #050608; --fg: #f3f5f8; --muted: #a9b1bf; --ballot: #2a4fd6; --p1: #ffc23a; --p2: #3ae0ff;
  --metal: linear-gradient(180deg,#fff 0%,#e3e8ee 40%,#9aa4b1 62%,#eef1f5 100%);
  --f-mark: "Saira", "Helvetica Neue", Arial, sans-serif;
  --f-he: "Secular One", "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --f-ui: "Assistant", "Arial Hebrew", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--f-ui); margin: 0; overflow: hidden; }
body.done { overflow-y: auto; }
#stage { position: relative; height: min(100dvh, 177.78vw); aspect-ratio: 9 / 16; max-width: 100%; margin: 0 auto; overflow: hidden; background: #000;
  container-type: inline-size; isolation: isolate; direction: rtl; }
.cam { position: absolute; inset: 0; }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 21; }

/* ---------- DiMax ident ---------- */
.mark { position: absolute; left: 50%; top: 40%; translate: -50% -50%; display: flex; align-items: baseline; z-index: 3; direction: ltr;
  font-family: var(--f-mark); font-style: italic; font-weight: 500; font-stretch: 118%; font-size: 19cqw; line-height: .8; white-space: nowrap; letter-spacing: -.01em;
  filter: drop-shadow(0 1.2cqw 2.4cqw #000c); }
.mark .D, .mark .stem, .mark .Max { background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: .1cqw rgba(255,255,255,.28); }
.mark .i { display: inline-block; position: relative; }
.mark .stem { display: inline-block; transform-origin: 50% 100%; }
.mark .dot { position: absolute; left: var(--dotL, 0); bottom: var(--dotB, 0); width: var(--dotS, 0); height: var(--dotS, 0); transform: skewX(var(--skew, -11deg));
  background: linear-gradient(165deg, #5b7dff, var(--ballot) 55%, #1a36a8); box-shadow: inset 0 0 0 .14cqw rgba(255,255,255,.45); }
.mark .sheen { position: absolute; inset: -12% -6%; pointer-events: none; mix-blend-mode: color-dodge;
  background: linear-gradient(105deg, transparent 44%, rgba(255,255,255,.9) 50%, transparent 56%) 150% 0 / 300% 100% no-repeat; }
.plate { position: absolute; left: 0; right: 0; top: 65%; display: grid; justify-items: center; gap: 1.8cqw; z-index: 3; opacity: 0; }
.plate b { font-family: var(--f-he); font-weight: 400; font-size: 6.4cqw; letter-spacing: .5em; padding-inline-start: .5em; color: #eef2f7; display: flex; align-items: center; gap: 3cqw; }
.plate b::before, .plate b::after { content: ""; width: 11cqw; height: 1px; background: linear-gradient(90deg, #dfe6ee, transparent); }
.plate b::after { transform: scaleX(-1); }
.plate small { font-size: 3.6cqw; color: var(--muted); }
.fog { position: absolute; inset: -20%; z-index: 4; pointer-events: none;
  background: radial-gradient(40% 25% at 30% 60%, #9fb3d81a, transparent), radial-gradient(45% 20% at 70% 40%, #9fb3d814, transparent); }
.plinth { position: absolute; left: 30%; right: 30%; top: 47%; height: 14%; z-index: 2; background: linear-gradient(#24357a, #121b45); border-radius: .6cqw; box-shadow: inset 0 1.5cqw 0 #3348a0; }
.plinth::before { content: ""; position: absolute; left: 30%; right: 30%; top: 0; height: 1.6cqw; background: #05070f; }
.drl { position: absolute; bottom: 3%; width: 22%; height: 1.4cqw; border-radius: 1cqw; background: #e8f3ff; box-shadow: 0 0 4cqw 1cqw #cfe6ff; z-index: 6; opacity: 0; }
.lit { position: absolute; inset: 0; z-index: 3; filter: brightness(.08); }

/* ---------- select screen ---------- */
.hud { position: absolute; left: 5%; right: 5%; z-index: 6; text-align: center; font-family: var(--f-he); color: #fff; }
.hud h2 { margin: 0; font-weight: 400; font-size: 8.5cqw; letter-spacing: .02em; text-shadow: 0 0 4cqw #ff8a2a88; }
.teams { position: absolute; left: 4%; right: 4%; top: 10.5%; display: flex; gap: 3.5cqw; z-index: 4; }
.team { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw; padding: 1.6cqw; border-radius: 1.8cqw; align-content: start; }
.team h3 { grid-column: 1 / -1; margin: 0 0 .4cqw; font: 400 4.4cqw/1.1 var(--f-he); text-align: center; }
.team.tr { background: linear-gradient(#ffc23a2e, #ffc23a08); border: .4cqw solid #ffc23a80; } .team.tr h3 { color: var(--p1); }
.team.tl { background: linear-gradient(#3ae0ff2e, #3ae0ff08); border: .4cqw solid #3ae0ff80; } .team.tl h3 { color: var(--p2); }
.tile { position: relative; aspect-ratio: 5 / 4; background: radial-gradient(circle at 50% 30%, #2a3350, #10131d); border: .5cqw solid #2b3140; overflow: hidden; }
.tile img { position: absolute; max-width: none; }
.tile i { position: absolute; inset: auto 0 0; font-style: normal; font-size: 3cqw; text-align: center; color: #fff; background: #000b; font-family: var(--f-ui); font-weight: 700; padding-block: .3cqw; }
.tile.p1 { border-color: var(--p1); box-shadow: 0 0 0 .6cqw var(--p1), 0 0 4cqw var(--p1); }
.tile.p2 { border-color: var(--p2); box-shadow: 0 0 0 .6cqw var(--p2), 0 0 4cqw var(--p2); }
.tile.risk { border-color: #fff; box-shadow: 0 0 0 .6cqw #fff, 0 0 4cqw #fff8; }
.tile.out img { filter: grayscale(1) brightness(.5); }
.tile.p1.bad, .tile.p2.bad { border-color: #ff2a4a; box-shadow: 0 0 0 .6cqw #ff2a4a, 0 0 4cqw #ff2a4a; }
.vm { position: absolute; left: 8%; right: 8%; bottom: 24%; height: 2.4cqw; background: #000c; border: .3cqw solid #fff; border-radius: .4cqw; z-index: 2; direction: ltr; }
.vm i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: linear-gradient(#ffe66b, #f2a400); }
.vm s { position: absolute; top: -1.2cqw; bottom: -1.2cqw; left: 54.2%; width: .5cqw; background: #fff; z-index: 1; }
.vm b { position: absolute; bottom: 160%; left: -20%; right: -20%; text-align: center; font: italic 800 4.4cqw/1 var(--f-mark); color: #fff; text-shadow: 0 .4cqw 0 #000, 0 0 2cqw #000; }
.vm.fail i { background: #ff4a3a; } .vm.pass i { background: #5fe08a; }
.stamp { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mark); font-style: italic; font-weight: 800; font-size: 10cqw; color: #fff; text-shadow: 0 0 2cqw #000; }
.tile .bn { position: absolute; inset: 0 0 auto; padding: .8cqw 0; background: #000c; color: #ff4a3a; text-align: center; font: 700 3cqw/1 var(--f-ui); }
.dq { position: absolute; inset: 0; display: grid; place-content: center; gap: .6cqw; background: #b00e1ccc; color: #fff; text-align: center; line-height: 1; opacity: 0; }
.dq b { font-family: var(--f-mark); font-style: italic; font-weight: 800; font-size: 3.6cqw; } .dq small { font-family: var(--f-ui); font-weight: 700; font-size: 3cqw; }
.bars { font-family: var(--f-ui); font-size: 3.6cqw; display: grid; gap: 1cqw; margin-top: 1.5cqw; }
.bars div { display: grid; grid-template-columns: 50cqw 1fr; align-items: center; gap: 2cqw; text-align: start; }
.bars span { height: 2.4cqw; width: 0; background: linear-gradient(270deg, #ffd84a, #ff7a1a); justify-self: start; transition: width .35s ease-out; }
.split { position: absolute; inset: 0; z-index: 1; background: linear-gradient(115deg, #0c3448 0 49.6%, #fff 49.6% 50.4%, #3a0d0d 50.4%); }
.vs { position: absolute; left: 50%; top: 44%; translate: -50% -50%; z-index: 7; direction: ltr; font-family: var(--f-mark); font-style: italic; font-weight: 800; font-stretch: 110%; font-size: 30cqw;
  background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 4cqw #ff8a2a); opacity: 0; }
.round.he { direction: rtl; font-family: var(--f-he); font-style: normal; font-weight: 400; font-size: 13cqw; }
.move { position: absolute; top: 8%; z-index: 9; display: grid; gap: .6cqw; max-width: 46%; padding: 2cqw 3cqw; background: #000c; border-radius: 1.6cqw; opacity: 0; }
.move.m1 { right: 4%; text-align: right; border-right: 1cqw solid var(--p1); } .move.m2 { left: 4%; top: 17%; text-align: right; border-left: 1cqw solid var(--p2); }
.move b { font-family: var(--f-he); font-weight: 400; font-size: 6cqw; color: #fff; line-height: 1; }
.move small { font-family: var(--f-ui); font-weight: 700; font-size: 3cqw; color: var(--muted); }
.move i { font-family: var(--f-he); font-style: normal; font-size: 4.8cqw; color: #ffd84a; line-height: 1.1; }
.arena { position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse 80% 45% at 50% 78%, #ff8a2a22, transparent 70%), linear-gradient(#0008, transparent 30%, transparent 70%, #000a); }
.fhud { position: absolute; left: 3%; right: 3%; top: 8.5%; z-index: 8; display: grid; grid-template-columns: 1fr auto 1fr; gap: 2.4cqw; align-items: start; opacity: 0; }
.hp { display: grid; gap: 1cqw; } .hp b { font-family: var(--f-he); font-weight: 400; font-size: 5cqw; color: #fff; text-shadow: 0 .4cqw 1cqw #000; }
.hp.p2 { text-align: left; }
.hp span { position: relative; display: block; height: 3.6cqw; background: #1a1d26; border: .5cqw solid #e9edf3; border-radius: .6cqw; overflow: hidden; transform: skewX(-12deg); }
.hp em, .hp i { position: absolute; top: 0; bottom: 0; width: 100%; transition: width .25s ease-out; }
.hp.p1 em, .hp.p1 i { right: 0; } .hp.p2 em, .hp.p2 i { left: 0; }
.hp em { background: #ff4a3a; transition-duration: .6s; } .hp i { background: linear-gradient(#ffe66b, #f2a400); }
.clock { font-family: var(--f-mark); font-style: italic; font-weight: 800; font-size: 7cqw; color: #fff; text-shadow: 0 0 2cqw #ff8a2a; padding-top: 3cqw; }
.callout { position: absolute; top: 24%; z-index: 9; display: grid; gap: .6cqw; text-align: center; opacity: 0; max-width: 70%; }
.callout.c1 { right: 5%; } .callout.c2 { left: 5%; }
.callout small { font-family: var(--f-ui); font-weight: 700; font-size: 3.6cqw; color: #fff; letter-spacing: .06em; }
.callout b { font-family: var(--f-he); font-weight: 400; font-size: 9cqw; line-height: 1; color: #ffd84a; text-shadow: 0 .6cqw 0 #8a3b00, 0 0 4cqw #ff8a2a; }
.blackframe { position: absolute; inset: 0; z-index: 22; background: #000; opacity: 0; pointer-events: none; }
.ko { position: absolute; inset: 0; z-index: 12; display: grid; place-items: center; direction: ltr; font-family: var(--f-mark); font-style: italic; font-weight: 900; font-stretch: 115%; font-size: 34cqw;
  background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1cqw 0 #6a2a00) drop-shadow(0 0 5cqw #ff8a2a); opacity: 0; padding-bottom: 20%; }
.winner { position: absolute; left: 0; right: 0; top: 56%; z-index: 12; text-align: center; font-family: var(--f-he); font-size: 7cqw; color: #fff; text-shadow: 0 .5cqw 2cqw #000; opacity: 0; }
.bubble { position: absolute; z-index: 9; background: #fff; color: #111; font-family: var(--f-he); font-size: 4.6cqw; padding: 2cqw 3.2cqw; border-radius: 3cqw; max-width: 48%; opacity: 0; box-shadow: 0 1cqw 3cqw #0008; }
.booth { position: absolute; left: 50%; bottom: 2%; translate: -50% 0; width: 52%; z-index: 8; background: #000c; border: .3cqw solid #ffd84a55; border-radius: 2cqw; padding: 1.2cqw 2cqw 0; display: grid; grid-template-columns: 1fr 1fr; opacity: 0; }
.booth img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top; }
.booth span { grid-column: 1 / -1; text-align: center; font-family: var(--f-he); font-size: 3.4cqw; color: #ffd84a; padding-block: .6cqw; }
.alarm { position: absolute; left: 0; right: 0; top: 38%; z-index: 10; background: #d4142a; color: #fff; font-family: var(--f-he); font-size: 6.6cqw; text-align: center; padding: 2cqw 0; opacity: 0; }
.round { position: absolute; inset: 0; z-index: 11; display: grid; place-items: center; direction: ltr; font-family: var(--f-mark); font-style: italic; font-weight: 800; font-stretch: 112%; font-size: 19cqw; color: #ffd84a;
  text-shadow: 0 1cqw 0 #8a3b00, 0 0 5cqw #ff8a2a; opacity: 0; }

/* ---------- poster ---------- */
.bgp { position: absolute; inset: 0; background: #000 url("img/bg.jpg") center / cover; z-index: 0; }
.ch { position: absolute; z-index: 2; pointer-events: none; }
.ch img { width: 100%; height: 100%; object-fit: contain; object-position: bottom; display: block; filter: drop-shadow(0 1.5cqw 2cqw #000a); }
.shade { position: absolute; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(ellipse 95% 60% at 50% 42%, transparent 55%, #0009), linear-gradient(transparent 62%, #000d 82%, #000); }
.title { position: absolute; left: 4%; right: 4%; bottom: 3.5%; z-index: 8; text-align: center; color: #fff; display: grid; gap: 1.1cqw; }
.title h1 { margin: 0; font-family: var(--f-he); font-weight: 400; font-size: 14.5cqw; line-height: .95; letter-spacing: -.01em;
  background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .5cqw 0 #222) drop-shadow(0 1.5cqw 3cqw #000); }
.title .tag { font-family: var(--f-he); font-size: 5.6cqw; color: #fff; margin-top: -.6cqw; margin-bottom: 1cqw; text-shadow: 0 .4cqw 1.5cqw #000; }
.title .when { font-family: var(--f-ui); font-weight: 700; font-size: 4.6cqw; letter-spacing: .03em; }
.title .where { font-family: var(--f-ui); font-size: 4cqw; }
.title .what { font-family: var(--f-ui); font-size: 3.6cqw; color: var(--muted); }
.title .joke { font-family: var(--f-he); font-size: 4cqw; color: #ffd84a; margin-top: .6cqw; }
.title .fine { font-family: var(--f-ui); font-size: 2.6cqw; color: #8f97a6; margin-top: .8cqw; }
.title .fine button { all: unset; cursor: pointer; text-decoration: underline; }

/* ---------- arcade start screen ---------- */
.ghosts img { position: absolute; bottom: 0; height: 58%; translate: -50% 0; filter: brightness(0) drop-shadow(0 0 1.2cqw var(--c)); opacity: .9; }
.ghosts .g1 { --c: var(--p1); } .ghosts .g2 { --c: var(--p2); }
.start { position: absolute; inset: 0; z-index: 12; display: grid; align-content: center; justify-items: center; gap: 3.2cqw; text-align: center; padding-bottom: 30%; }
.presents { font-family: var(--f-he); font-size: 4.2cqw; color: var(--muted); letter-spacing: .08em; }
.press { font-family: var(--f-mark); font-style: italic; font-weight: 800; font-stretch: 112%; font-size: 13cqw; line-height: 1; color: #ffd84a;
  text-shadow: 0 .8cqw 0 #8a3b00, 0 0 5cqw #ff8a2a; animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.press-he { font-family: var(--f-he); font-size: 6cqw; color: #fff; }
.pollline { max-width: 84%; font: 700 3.4cqw/1.45 var(--f-ui); color: #ffd84a; text-shadow: 0 .3cqw 0 #8a3b00; }
.pollline small { display: block; color: var(--muted); text-shadow: none; }
.btns { display: grid; gap: 3cqw; margin-top: 3cqw; width: 68%; }
.arc { font: 400 6cqw/1 var(--f-he); padding: 4.2cqw 0; border-radius: 999px; cursor: pointer; border: 0; color: #111;
  box-shadow: 0 1.4cqw 0 #0008, inset 0 -1cqw 0 #0003; transition: transform .08s; }
.arc:active { transform: translateY(1cqw); box-shadow: 0 .4cqw 0 #0008, inset 0 -1cqw 0 #0003; }
.arc:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.a1 { background: linear-gradient(#ffe07a, var(--p1)); } .a2 { background: linear-gradient(#9cf3ff, var(--p2)); }
.credit { font-family: var(--f-ui); font-weight: 700; font-size: 3.2cqw; color: #8f97a6; margin-top: 2cqw; }
@media (prefers-reduced-motion: reduce) { .press { animation: none; } }

/* ---------- UI chips ---------- */
.ui { position: absolute; z-index: 30; font: 700 3.4cqw/1 var(--f-ui); color: #fff; background: #000a; border: 1px solid #fff4; border-radius: 999px;
  padding: 1.8cqw 3cqw; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ui:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }
#snd { top: 2.5%; inset-inline-start: 3%; }
#skip { top: 2.5%; inset-inline-end: 3%; }
#again { top: 2.5%; inset-inline-end: 3%; }
#credits { position: absolute; inset: 6% 6% 6%; z-index: 40; background: #0b0d12f2; border: 1px solid #fff3; border-radius: 3cqw; padding: 5cqw; overflow: auto;
  font-size: 3.4cqw; line-height: 1.5; color: var(--muted); }
#credits h3 { margin: 0 0 2cqw; font-family: var(--f-he); font-weight: 400; color: #fff; font-size: 5cqw; }
#credits ul { margin: 0; padding-inline-start: 4cqw; }
#credits a { color: #cfe2ff; }
@media (prefers-reduced-motion: reduce) { .mark .sheen { display: none; } }

/* ---------- fighters (pose sprites face right; .flip mirrors the right-side fighter) ---------- */
.mv, .bob { position: absolute; inset: 0; }
.ch img.flip { scale: -1 1; }
.combo, .blocktxt { position: absolute; top: 30%; z-index: 9; direction: ltr; font-family: var(--f-mark); font-style: italic; font-weight: 900; line-height: .9; opacity: 0; text-align: center; }
.combo { font-size: 9cqw; color: #fff; text-shadow: 0 .6cqw 0 #8a3b00, 0 0 3cqw #ff8a2a; } .combo small { display: block; font-size: 5cqw; color: #ffd84a; }
.blocktxt { font-size: 6cqw; color: #bfe9ff; text-shadow: 0 0 3cqw #3ae0ff; }
.prop { position: absolute; z-index: 7; pointer-events: none; filter: drop-shadow(0 0 2.5cqw var(--c)) drop-shadow(0 1cqw 1cqw #000a); }
.prop img { width: 100%; height: 100%; object-fit: contain; }
.beam { position: absolute; z-index: 6; border-radius: 99px; background: linear-gradient(#fff, var(--c) 35%, var(--c) 65%, #fff); box-shadow: 0 0 4cqw var(--c), 0 0 10cqw var(--c); pointer-events: none; }
.redline { position: absolute; left: 0; right: 0; top: 47%; height: 1.6cqw; z-index: 6; background: #ff2a2a; box-shadow: 0 0 4cqw #ff2a2a; transform-origin: right; pointer-events: none; }
.ring { position: absolute; z-index: 6; width: 26cqw; height: 26cqw; margin: -13cqw 0 0 -13cqw; border-radius: 50%; border: 1.4cqw solid var(--c); box-shadow: 0 0 4cqw var(--c); pointer-events: none; }
.stampmark { position: absolute; top: 58%; z-index: 8; width: 24cqw; height: 24cqw; margin: -12cqw 0 0 -12cqw; border-radius: 50%; border: 1.6cqw double var(--c); rotate: -14deg; opacity: 0; pointer-events: none; }
.orb { position: absolute; z-index: 7; width: 12cqw; height: 12cqw; margin: -6cqw 0 0 -6cqw; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff 0 18%, var(--c) 40%, transparent 70%); filter: drop-shadow(0 0 3cqw var(--c)); }
.dmg { position: absolute; z-index: 9; direction: ltr; font: italic 900 6cqw/1 var(--f-mark); color: #fff; text-shadow: 0 .4cqw 0 #000; pointer-events: none; }

/* ---------- same-team glitch ---------- */
.cam.glitching { animation: glitch .14s steps(2, jump-none) infinite; }
@keyframes glitch {
  0% { transform: translate(1.6cqw, 0); filter: drop-shadow(-1.2cqw 0 #ff00d0) drop-shadow(1.2cqw 0 #00f0ff) hue-rotate(60deg); clip-path: inset(0 0 46% 0); }
  50% { transform: translate(-1.6cqw, .6cqw); filter: invert(.15) drop-shadow(1cqw 0 #ff00d0); clip-path: inset(30% 0 12% 0); }

  let lit = false;

  onSeen(roll, () => { if (rolled || RM) return; rolled = true; const dist = track2.scrollHeight - roll.clientHeight;
    if (dist > 0) track2.animate([{ transform: 'none' }, { transform: `translateY(${-dist}px)` }], { duration: dist * 28, delay: 600, easing: 'linear', fill: 'forwards' }); }, .5);
  onSeen(mk, () => { if (lit) return; lit = true; fitMark(m);
    A(m.querySelector('.dot'), [{ translate: '0 -40cqw', opacity: 0 }, { translate: '0 0', opacity: 1, offset: .6 }, { translate: '0 -4cqw', offset: .8 }, { translate: '0 0' }], { duration: 900, delay: 200, easing: 'ease-in' });
    setTimeout(() => { sfx('ballot', .5, false); [dl, dr].forEach((b) => A(b, [{ opacity: .15 }, { opacity: 1 }, { opacity: .3 }, { opacity: 1 }], { duration: 320 }));
      A(foot.querySelector('.glow'), [{ opacity: 0 }, { opacity: 1 }, { opacity: .55 }], { duration: 900 }); sweep(m, 1300); }, 900); }, .6);
}
const VICTOR = () => LAST || [P1, P2];                 // [winner, loser]; a skipped show uses the drawn pair
function fillMore() {                                  // this run's winner and loser, and a fresh countdown
  const [w, l] = VICTOR();
  more.querySelectorAll('.w').forEach((n) => (n.src = POSE(w, 'stance')));
  more.querySelector('.arena2 .l').src = POSE(l, 'hit'); more.querySelector('.pair .l').src = POSE(l, 'hit'); more.querySelector('.pair .w').src = POSE(w, 'punch');
  more.querySelector('.wt').textContent = fmt(C.fight.winner, { name: NAME[w] });
  more.resetWin?.(); more.resetCont?.(); more.querySelector('.ballots').textContent = ballots();
}

// ---------- UI ----------
function showCredits() {
  if (document.getElementById('credits')) return;
  const box = el('div', '', `<h3>${C.credits.title}</h3><p>${C.credits.intro}</p>${creditList()}<p>${C.credits.outro}</p>`);
  box.id = 'credits'; const x = el('button', 'ui', C.ui.close); x.style.cssText = 'position:sticky;top:0;float:left'; x.onclick = () => box.remove();
  box.prepend(x); stage.append(box);
}
const uiBtn = (id, txt, fn) => { const b = el('button', 'ui', txt); b.id = id; b.type = 'button'; b.onclick = fn; stage.append(b); return b; };
let sndBtn = null, skipBtn = null, againBtn = null, downBtn = null;
const paintSnd = () => { if (!sndBtn) return; sndBtn.textContent = soundOn ? C.ui.sound_on : C.ui.sound_off; sndBtn.setAttribute('aria-pressed', String(soundOn)); };
const showSnd = () => { if (!sndBtn) sndBtn = uiBtn('snd', '', () => { soundOn = !soundOn; if (soundOn) unlock(); if (bus) bus.master.gain.setTargetAtTime(soundOn ? .8 : 0, AC.currentTime, .05); paintSnd(); }); paintSnd(); };

function reset() { timers.forEach(clearTimeout); timers = []; FX.clear(); stopAll(); cam.getAnimations().forEach((a) => a.cancel()); cam.innerHTML = ''; cam.style.opacity = 1;
  cam.classList.remove('glitching'); document.body.classList.remove('done');
  document.getElementById('credits')?.remove(); [skipBtn, againBtn, downBtn].forEach((b) => b?.remove()); skipBtn = againBtn = downBtn = null; }

// 1. DiMax ident (silent: the page has had no tap yet)  2. arcade start screen  3. the trailer  4. text last  5. scroll for details
function boot() { reset(); soundOn = false; rollStyles(false); rollThreshold(); rollFighters(); ident(); at(7700, startScreen);
  skipBtn = uiBtn('skip', C.ui.skip, () => { track('skip_logo'); startScreen(); }); }   // startScreen's reset() removes the chip
function startScreen() {
  reset(); cam.style.background = 'radial-gradient(ellipse at 50% 35%, #1a2140, #05060b 75%)';
  const ghosts = el('div', 'ghosts');
  [[P1, 72, 'g1'], [P2, 28, 'g2']].forEach(([id, x, cls]) => { const g = new Image(); g.src = IMG(id); g.alt = ''; g.style.left = `${x}%`; g.className = cls; ghosts.append(g); });
  const S = C.start, s = el('div', 'start', `
    <div class="press" dir="ltr">${S.press}</div>
    <div class="press-he">${S.sub}</div>
    ${pollLine()}
    <div class="btns">
      <button type="button" id="goSnd" class="arc a1">${S.sound}</button>
      <button type="button" id="goMute" class="arc a2">${S.mute}</button>
    </div>
    <div class="credit">${ballots()}</div>`);
  cam.append(ghosts, s);
  A(s, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 });
  const go = (withSound) => { track(withSound ? 'start_sound' : 'start_mute'); soundOn = withSound; if (withSound) { unlock(); sfx('ballot', .7, false); } flash(.5, 140); shake(6); setTimeout(trailer, 350); };
  s.querySelector('#goSnd').onclick = () => go(true);
  s.querySelector('#goMute').onclick = () => go(false);
}
function end() {
  skipBtn?.remove(); skipBtn = null; document.body.classList.add('done'); fillMore(); track('finish');
  againBtn = uiBtn('again', `${C.ui.again} ${ICON.replay}`, () => { track('again'); C = resolve(RAW); rollStyles(false); rollFighters(LAST?.[0]);   /* every run: fresh clay / LEGO / 3D mix */ trailer(); });
  downBtn = uiBtn('down', ICON.down, () => track('scroll_btn') || more.scrollIntoView({ behavior: 'smooth' })); downBtn.setAttribute('aria-label', C.details.scroll);
}
function trailer() {
  reset(); showSnd();
  skipBtn = uiBtn('skip', C.ui.skip, () => { track('skip'); if (!DECIDED) { LAST = [P1, P2]; bench([P2]); DECIDED = true; }   /* skipped before the fight: the shown result counts */ reset(); poster(false); mix('fin'); music('fin'); end(); });
  const s = select();
  at(s + 500, () => { const d = fight(); at(d, () => poster(true)); at(d + 3300, end); });
}

Promise.all([document.fonts.load('italic 500 40px Saira'), document.fonts.load('40px "Secular One"')]).catch(() => {})
  .then(() => fetch('copy.json', { cache: 'no-cache' })).then((r) => r.json()).then((j) => {
    RAW = j; C = resolve(RAW); Object.assign(NAME, C.names); computePower(); buildMore(); track('load');
    if (C.links.stats) fetch(C.links.stats.replace(/\/$/, '') + '/count').then((r) => r.json()).then((x) => { FIGHTS = x.fights; WINS = x.wins || {}; paintWins(); document.querySelectorAll('.credit, .ballots').forEach((n) => (n.textContent = ballots())); }).catch(() => {});
    if (location.hash === '#poster') { reset(); rollStyles(true); poster(false); } else boot();
  });
</script>
