name: polls

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test_update_polls.py
      - run: python3 scripts/update_polls.py copy.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- copy.json; then
            echo "copy.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copy.json
          git commit -m "polls: daily update"
          git push origin HEAD:main
